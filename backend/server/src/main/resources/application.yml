# Arcus API configuration. Every value can be set with the environment variable shown.
spring:
  application:
    name: arcus
  datasource:
    # JDBC URL, e.g. jdbc:postgresql://localhost:5432/arcus. Must be an ordinary role (no superuser/BYPASSRLS):
    # tenant isolation is enforced by Postgres row-level security.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arcus}
    username: ${DATABASE_USER:arcus}
    password: ${DATABASE_PASSWORD:arcus}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  structured:
    format:
      # JSON lines for Google Cloud Logging / Error Reporting; set LOG_FORMAT=plain-text locally if you prefer.
      console: ${LOG_FORMAT:com.arcus.platform.telemetry.GcpLogFormatter}
  level:
    root: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

arcus:
  # Public URL of the web app, used in links sent on WhatsApp.
  app-url: ${APP_URL:http://localhost:3000}
  session-days: ${SESSION_DAYS:30}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:log}
    meta-token: ${META_WA_TOKEN:}
    meta-phone-number-id: ${META_WA_PHONE_NUMBER_ID:}
  # Only for local experiments: allow a database role that bypasses row-level security.
  allow-rls-bypass-role: ${ALLOW_RLS_BYPASS_ROLE:false}
