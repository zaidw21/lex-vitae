# Run the whole platform locally:  docker compose up --build   →  http://localhost:3000
# Load demo data (optional):        docker compose run --rm seed
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arcus
      POSTGRES_PASSWORD: arcus
      POSTGRES_DB: arcus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcus"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://arcus:arcus@db:5432/arcus
      APP_URL: http://localhost:3000
      WHATSAPP_PROVIDER: log
    depends_on:
      db:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: .
      target: build
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    environment:
      DATABASE_URL: postgresql://arcus:arcus@db:5432/arcus
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
